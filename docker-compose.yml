services:

  # ─── Relational Database: PostgreSQL 16 ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: movieweb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: movies
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mount initialization script and SQL files
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./db:/docker-db-scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d movies"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ─── NoSQL Database: MongoDB 7 ───────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: movieweb-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Backend API: Node.js / Express / TypeScript ────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: movieweb-api
    restart: unless-stopped
    ports:
      - "3500:3500"
    volumes:
      - ./api:/app
      - /app/node_modules
    env_file:
      - ./api/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: movies
      DB_SCHEMA: movies
      MONGO_URI: mongodb://mongo:27017/movieweb
      PORT: "3500"
      CORS_ORIGIN: http://localhost:4200
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  # ─── Frontend: Angular 22 (Standalone + Signals) ────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: movieweb-web
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      BROWSER: none
    depends_on:
      - api

volumes:
  pgdata:
  mongodata:
